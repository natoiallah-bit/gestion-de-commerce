name: Applications Android et Windows

# Fabrique l'application téléphone (.apk) et l'installateur Windows (.exe).
# Les fichiers sont publiés dans « Releases » sous le numéro de version de
# application/package.json (v1.0.0…) : changer ce numéro crée une nouvelle version,
# sinon la version existante est mise à jour.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['application/**', 'app/**', 'bootstrap/**', 'config/**', 'database/**', 'lang/**', 'public/**', 'resources/**', 'routes/**', 'composer.lock', '.github/workflows/applications.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test
      - run: npm run build

  android:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run android
      - name: Construire l'APK
        working-directory: application/android
        env:
          CLE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$CLE_BASE64" ]; then
            # APK signé avec la clé fixe d'AlgoCommerce : les mises à jour s'installent par-dessus
            # Le secret peut avoir été collé avec des espaces ou des retours à la ligne : on les retire
            if ! printf '%s' "$CLE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/algocommerce.jks" 2>/dev/null; then
              echo "::error::Le secret ANDROID_KEYSTORE_BASE64 est incomplet ou abîmé : recollez la longue ligne du fichier AlgoCommerce-cle-signature.txt, en entier."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/algocommerce.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "::error::La clé de signature ne s'ouvre pas : vérifiez le secret ANDROID_KEYSTORE_PASSWORD (mot de passe du fichier AlgoCommerce-cle-signature.txt) et que ANDROID_KEYSTORE_BASE64 est complet."
              exit 1
            fi
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/algocommerce.jks"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../AlgoCommerce.apk
            rm -f "$RUNNER_TEMP/algocommerce.jks"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : APK de test (clé temporaire), les mises à jour demanderont de désinstaller."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../AlgoCommerce.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: application/AlgoCommerce.apk

  windows:
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - run: npm run exe

      # --- AlgoCommerce Serveur : installateur tout compris (PHP portable + AlgoCommerce)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, openssl, fileinfo, curl
          coverage: none
          tools: composer
      - name: Préparer le serveur intégré
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          $dest = "application/build-serveur"
          New-Item -ItemType Directory -Force "$dest/laravel", "$dest/php" | Out-Null
          foreach ($e in 'app','bootstrap','config','database','lang','public','resources','routes','vendor','artisan','composer.json') {
            Copy-Item $e "$dest/laravel/" -Recurse -Force
          }
          Remove-Item "$dest/laravel/bootstrap/cache/*.php" -ErrorAction SilentlyContinue
          Remove-Item "$dest/laravel/database/database.sqlite" -ErrorAction SilentlyContinue
          $phpDir = Split-Path (Get-Command php).Source
          Copy-Item "$phpDir/*" "$dest/php/" -Recurse -Force
          # Bibliothèques Visual C++ nécessaires à PHP, pour les PC où elles manquent
          foreach ($dll in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') {
            if (Test-Path "C:\Windows\System32\$dll") { Copy-Item "C:\Windows\System32\$dll" "$dest/php/" -Force }
          }
          @(
            'extension=curl', 'extension=fileinfo', 'extension=mbstring', 'extension=openssl',
            'extension=pdo_sqlite', 'extension=sqlite3',
            'memory_limit=256M', 'max_execution_time=120', 'upload_max_filesize=8M', 'post_max_size=16M',
            'date.timezone=Africa/Ndjamena', 'display_errors=Off', 'log_errors=On'
          ) | Set-Content "$dest/php/php.ini" -Encoding ascii
          $ext = (Resolve-Path "$dest/php/ext").Path
          $modules = & "$dest/php/php.exe" -c "$dest/php/php.ini" -d "extension_dir=$ext" -m
          foreach ($m in 'pdo_sqlite','sqlite3','mbstring','openssl','fileinfo','curl') {
            if (-not ($modules -contains $m)) { throw "Extension PHP manquante dans le PHP portable : $m" }
          }
      - name: Vérifier le serveur intégré sous Windows
        run: node outils/verifier-serveur.cjs
      - name: Construire AlgoCommerce Serveur
        run: npx electron-builder --config electron-builder-serveur.json --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: application/dist-electron/*.exe

  publication:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./application/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AlgoCommerce ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: fichiers/*
          body: |
            **Téléphone Android** : téléchargez `AlgoCommerce.apk` sur le téléphone et ouvrez-le
            (autorisez « installer des applications inconnues » si Android le demande).

            **Ordinateur principal de la boutique** : téléchargez `AlgoCommerce-Serveur-Installation-….exe`
            et installez-le. Tout est compris (rien d'autre à installer) ; 15 jours d'essai.
            Compte de départ : gerant@boutique.local / changer-ce-mot-de-passe (à changer ensuite).

            **Téléphones Android** : installez `AlgoCommerce.apk`, puis indiquez l'adresse affichée
            dans AlgoCommerce Serveur (menu Appareils), votre e-mail et votre mot de passe.

            **Autres ordinateurs de caisse (facultatif)** : `AlgoCommerce-Installation-….exe`.
