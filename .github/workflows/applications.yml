name: Applications Android et Windows

# Fabrique l'application téléphone (.apk) et l'installateur Windows (.exe).
# Les fichiers sont publiés dans « Releases » sous le numéro de version de
# application/package.json (v1.0.0…) : changer ce numéro crée une nouvelle version,
# sinon la version existante est mise à jour.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['application/**', '.github/workflows/applications.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test
      - run: npm run build

  android:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run android
      - name: Construire l'APK
        working-directory: application/android
        env:
          CLE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$CLE_BASE64" ]; then
            # APK signé avec la clé fixe d'AlgoCommerce : les mises à jour s'installent par-dessus
            # Le secret peut avoir été collé avec des espaces ou des retours à la ligne : on les retire
            if ! printf '%s' "$CLE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/algocommerce.jks" 2>/dev/null; then
              echo "::error::Le secret ANDROID_KEYSTORE_BASE64 est incomplet ou abîmé : recollez la longue ligne du fichier AlgoCommerce-cle-signature.txt, en entier."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/algocommerce.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "::error::La clé de signature ne s'ouvre pas : vérifiez le secret ANDROID_KEYSTORE_PASSWORD (mot de passe du fichier AlgoCommerce-cle-signature.txt) et que ANDROID_KEYSTORE_BASE64 est complet."
              exit 1
            fi
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/algocommerce.jks"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../AlgoCommerce.apk
            rm -f "$RUNNER_TEMP/algocommerce.jks"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : APK de test (clé temporaire), les mises à jour demanderont de désinstaller."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../AlgoCommerce.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: application/AlgoCommerce.apk

  windows:
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - run: npm run exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: application/dist-electron/*.exe

  publication:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./application/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AlgoCommerce ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: fichiers/*
          body: |
            **Téléphone Android** : téléchargez `AlgoCommerce.apk` sur le téléphone et ouvrez-le
            (autorisez « installer des applications inconnues » si Android le demande).

            **Ordinateur Windows** : téléchargez `AlgoCommerce-Installation-….exe` et lancez-le.

            Au premier lancement, indiquez l'adresse de votre serveur, votre e-mail et votre mot de passe.
